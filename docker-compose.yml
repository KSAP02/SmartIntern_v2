services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /app/data
      SNAPSHOT_DIR: /app/snapshots
    volumes:
      # App data (SQLite, resume files, Milvus Lite) survives `docker compose down`.
      - appdata:/app/data
      # Read-only copy of app.db, refreshed after every change (for notebooks on the host).
      - ./data_warehouse/snapshots:/app/snapshots
      # Tuning: settings/config.toml. Read-write: System -> Admin settings saves into it, and
      # hand edits are picked up within ~30 s (no restart).
      - ./settings:/app/settings
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12

  frontend:
    build: ./frontend
    env_file:
      - path: .env
        required: false
    environment:
      BACKEND_URL: http://backend:8000
      FRONTEND_PORT: "3000"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  appdata:
